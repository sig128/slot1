# SLOT1 services. Profiles:
#   infra     Postgres + Redis for local development        docker compose --profile infra up -d
#   s3        MinIO, S3-compatible media storage           (add --profile s3)
#   ingest    nginx-rtmp ingest gateway                     (add --profile ingest)
#   mediamtx  MediaMTX ingest gateway instead of nginx-rtmp (add --profile mediamtx)
#   app       API, worker, web and the shared GTA-model inference service (infra/docker/app.Dockerfile)
#   edge      Caddy in front of web and API with automatic HTTPS
# Full stack: docker compose --profile infra --profile app --profile ingest --profile edge up -d --build
name: slot1

x-app-env: &app-env
  DATABASE_URL: postgres://slot1:${POSTGRES_PASSWORD:-slot1}@postgres:5432/slot1
  REDIS_URL: redis://redis:6379
  SLOT1_API_HOST: 0.0.0.0
  SLOT1_API_PORT: "4000"
  SLOT1_API_INTERNAL_URL: http://api:4000
  SLOT1_TRUST_PROXY: "true"
  STORAGE_FS_ROOT: /data/storage
  UPLOAD_TMP_DIR: /data/uploads
  INGEST_SEGMENT_DIR: /data/ingest-buffer

services:
  postgres:
    image: postgres:16-alpine
    profiles: [infra]
    environment:
      POSTGRES_USER: slot1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slot1}
      POSTGRES_DB: slot1
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slot1 -d slot1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    profiles: [infra]
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    profiles: [s3]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-slot1-minio}
      # Compose reads every service's variables even when its profile is off, so no ":?" guard here;
      # MinIO itself refuses to start without a password of 8+ characters.
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio:/data]

  api:
    build: { context: ., dockerfile: infra/docker/app.Dockerfile, target: api }
    profiles: [app]
    env_file: [.env]
    environment: *app-env
    volumes: [media:/data]
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Healthy once migrations have run and the database and Redis answer.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: infra/docker/app.Dockerfile, target: worker }
    profiles: [app]
    env_file: [.env]
    environment: *app-env
    # Same media volume as the API when STORAGE_DRIVER=fs.
    volumes: [media:/data]
    depends_on:
      # The API applies the database migrations the worker reads.
      api: { condition: service_healthy }
    restart: unless-stopped

  # Shared GTA-model inference: batches frames from every live stream. Workers use it when .env
  # sets INFERENCE_URL=http://inference:4100 and the same INFERENCE_SHARED_SECRET.
  inference:
    build: { context: ., dockerfile: infra/docker/app.Dockerfile, target: inference }
    # GPU: use target inference-gpu, set INFERENCE_EXECUTION_PROVIDERS=cuda,cpu, and uncomment the
    # reservation below (needs an NVIDIA driver and the NVIDIA Container Toolkit on the host).
    profiles: [app]
    env_file: [.env]
    environment:
      <<: *app-env
      INFERENCE_HOST: 0.0.0.0
      INFERENCE_PORT: "4100"
    # Reads model files from the same storage as the API when STORAGE_DRIVER=fs.
    volumes: [media:/data]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  web:
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
      target: web
      args: { SLOT1_API_INTERNAL_URL: "http://api:4000" }
    profiles: [app]
    env_file: [.env]
    environment:
      SLOT1_API_INTERNAL_URL: http://api:4000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    restart: unless-stopped

  # nginx-rtmp gateway: creators publish to rtmp://<host>:1935/live/<name>?key=<key>.
  ingest:
    build: { context: infra/nginx-rtmp }
    profiles: [ingest]
    environment:
      SLOT1_HOOK_BASE: http://api:4000
      # Empty = every hook call is refused by the API (it fails closed without INGEST_HOOK_SECRET).
      INGEST_HOOK_SECRET: ${INGEST_HOOK_SECRET:-}
    ports: ["1935:1935"]
    restart: unless-stopped

  mediamtx:
    # "1" is MediaMTX's latest 1.x release (kept backward compatible within 1.x).
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:1}
    profiles: [mediamtx]
    environment:
      MTX_AUTHHTTPADDRESS: http://api:4000/api/ingest/hooks/mediamtx/auth?hook_secret=${INGEST_HOOK_SECRET:-}
      # Host name or IP browsers use to reach WebRTC media (ICE candidates). See docs/LIVE_VIDEO.md.
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_PUBLIC_HOST:-}
    volumes: ["./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro"]
    ports:
      - "1935:1935"          # RTMP publish (OBS)
      # WebRTC HTTP (WHIP publish, WHEP playback). Public traffic reaches it over HTTPS through
      # Caddy (/live/*); this port is for local development only.
      - "127.0.0.1:8889:8889"
      - "8189:8189/udp"      # WebRTC media (ICE)
      - "8890:8890/udp"      # SRT publish
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: [edge]
    environment:
      SLOT1_DOMAIN: ${SLOT1_DOMAIN:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports: ["80:80", "443:443"]
    depends_on: [web, api]
    restart: unless-stopped

volumes:
  postgres:
  redis:
  minio:
  media:
  caddy-data:
