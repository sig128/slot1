# MediaMTX as SLOT1's ingest gateway. Every publish and every read is decided by the SLOT1 API
# (authMethod: http). The auth address, including ?hook_secret=..., is set by docker compose via
# MTX_AUTHHTTPADDRESS so the secret is never written into this file.
logLevel: info
logDestinations: [stdout]

authMethod: http
authHTTPAddress: http://api:4000/api/ingest/hooks/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

api: false
metrics: false
pprof: false
playback: false

# Creators publish over RTMP (OBS: rtmp://<host>:1935/live, stream key from Studio).
rtmp: true
rtmpAddress: :1935
# The SLOT1 worker reads over RTSP on the private network.
rtsp: true
rtspAddress: :8554
# TCP only: RTSP over UDP needs the real client address, which Docker's network can rewrite.
rtspTransports: [tcp]
hls: false

# WebRTC: OBS 30+ publishes with WHIP (<base>/live/<name>/whip, bearer token = stream key) and
# browsers watch with WHEP (<base>/live/<name>/whep, bearer token from SLOT1's API). Sub-second
# delay. Public host names and STUN/TURN servers come from the environment, e.g.
# MTX_WEBRTCADDITIONALHOSTS=live.example.com and MTX_WEBRTCICESERVERS2_0_URL=turn:turn.example.com:3478
# (see docs/LIVE_VIDEO.md). In production Caddy serves :8889 over HTTPS under /live/* on the
# site's own domain (infra/caddy/Caddyfile), so INGEST_PUBLIC_WEBRTC_URL is https://<your domain>.
webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

# SRT publishing (srt://<host>:8890?streamid=publish:live/<name>:<name>:<key>).
srt: true
srtAddress: :8890

paths:
  "~^live/[a-z0-9]{4,40}$":
    source: publisher
